<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Mock workflow preview">
<rect x="0" y="0" width="900" height="420" fill="#eef3f8"/>
<rect x="24" y="24" width="852" height="372" rx="28" fill="#ffffff" stroke="#cfd9e6" stroke-width="1"/>
<text x="52" y="64" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172033">Mock workflow preview</text>
<text x="52" y="90" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b">Write tasks require one approval and dirty repos require explicit override.</text>
<text x="52" y="114" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Generated mock preview. No real chat data.</text>
<rect x="52" y="142" width="380" height="80" rx="18" fill="#ecfdf5" stroke="#d8e1ec" stroke-width="1"/>
<text x="74" y="169" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748b">User command</text>
<text x="74" y="200" font-family="Consolas, Menlo, monospace" font-size="15" fill="#172033">/run main update README</text>
<rect x="468" y="142" width="380" height="124" rx="18" fill="#fff7ed" stroke="#d8e1ec" stroke-width="1"/>
<text x="490" y="169" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748b">Bot response</text>
<text x="490" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172033">⚠️ Approval required</text>
<text x="490" y="222" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172033">Risk: write_workspace</text>
<text x="490" y="244" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172033">Options: /approve or /deny</text>
<rect x="52" y="288" width="796" height="116" rx="18" fill="#ffffff" stroke="#d8e1ec" stroke-width="1"/>
<text x="74" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748b">Outcome</text>
<text x="74" y="347" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172033">blocked_repo_dirty</text>
<text x="74" y="369" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172033">If the repo is dirty, approval is blocked until the user chooses.</text>
<text x="74" y="391" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172033">Options: /approve_anyway or /deny</text>
<rect x="326" y="304" width="152" height="28" rx="14" fill="#fef3c7" stroke="none" stroke-width="1"/>
<text x="338" y="323" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#172033">pending approval</text>
<rect x="488" y="304" width="168" height="28" rx="14" fill="#fee2e2" stroke="none" stroke-width="1"/>
<text x="500" y="323" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#172033">blocked_repo_dirty</text>
<rect x="666" y="304" width="160" height="28" rx="14" fill="#e0e7ff" stroke="none" stroke-width="1"/>
<text x="678" y="323" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#172033">explicit override</text>
</svg>
