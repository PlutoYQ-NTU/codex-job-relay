<text x="508" y="323" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#172033">artifacts</text>
<rect x="602" y="304" width="86" height="28" rx="14" fill="#dcfce7" stroke="none" stroke-width="1"/>
<text x="614" y="323" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#172033">success</text>
<rect x="698" y="304" width="128" height="28" rx="14" fill="#fef3c7" stroke="none" stroke-width="1"/>
<text x="710" y="323" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#172033">mobile report</text>
