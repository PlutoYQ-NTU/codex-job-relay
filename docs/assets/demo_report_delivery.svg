<rect x="0" y="0" width="900" height="420" fill="#eef3f8"/>
<rect x="24" y="24" width="852" height="372" rx="28" fill="#ffffff" stroke="#cfd9e6" stroke-width="1"/>
<text x="52" y="64" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172033">Telegram demo preview</text>
