<text x="490" y="222" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172033">Attached files are sent back</text>
<text x="490" y="244" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172033">for mobile review.</text>
<rect x="52" y="288" width="796" height="116" rx="18" fill="#ffffff" stroke="#d8e1ec" stroke-width="1"/>
<text x="74" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748b">Outcome</text>
<text x="74" y="347" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172033">Attached files: report_telegram.md, stdout_tail.log,</text>
<text x="74" y="369" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172033">artifact_manifest.json, figure_preview.png</text>
