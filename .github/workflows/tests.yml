name: tests

on:
  push:
  pull_request:

jobs:
  controller-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile controller
        run: py -m py_compile telegram_codex_controller\controller.py
      - name: Run offline self-test
        run: py telegram_codex_controller\controller.py --self-test
